name: Upload tested release JAR

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify packaged JAR
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS
      - name: Attach locally tested version 2.7.0 to its release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v2.7.0 release-assets/GTS-Shirokai-2.7.0.jar release-assets/SHA256SUMS --clobber
